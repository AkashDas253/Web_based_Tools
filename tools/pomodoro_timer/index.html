<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pomodoro-container">
        <header class="app-header">
            <h1>Pomodoro Timer</h1>
            <button id="settings-toggle-btn" class="icon-btn" title="Settings">⚙️</button>
        </header>
        
        <div class="mode-selector">
            <button id="work-btn" class="mode-btn active">Work</button>
            <button id="short-break-btn" class="mode-btn">Short Break</button>
            <button id="long-break-btn" class="mode-btn">Long Break</button>
        </div>

        <div class="timer-display">
            <span id="minutes">25</span>:<span id="seconds">00</span>
        </div>

        <div class="session-counter">
            Completed Sessions: <span id="session-count">0</span>/4
        </div>

        <div class="controls">
            <button id="start-btn">Start</button>
            <button id="reset-btn">Reset</button>
        </div>

        <div class="ambient-controls">
            <button id="ambient-btn" class="ambient-btn">🎵 White Noise: Off</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Timer Settings</h2>
            <div class="setting-field">
                <label for="work-duration">Work (minutes):</label>
                <input type="number" id="work-duration" min="1" max="120" value="25">
            </div>
            <div class="setting-field">
                <label for="short-break-duration">Short Break (minutes):</label>
                <input type="number" id="short-break-duration" min="1" max="30" value="5">
            </div>
            <div class="setting-field">
                <label for="long-break-duration">Long Break (minutes):</label>
                <input type="number" id="long-break-duration" min="1" max="60" value="15">
            </div>
            <div class="modal-actions">
                <button id="save-settings-btn">Save Changes</button>
                <button id="close-settings-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
