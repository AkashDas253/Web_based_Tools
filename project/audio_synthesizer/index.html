<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modular Web Audio Synthesizer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎹</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="synth-container">
    <div class="controls-panel">
        <div class="control-group">
            <label for="waveform">Waveform</label>
            <select id="waveform">
                <option value="sine">Sine</option>
                <option value="square">Square</option>
                <option value="sawtooth" selected>Sawtooth</option>
                <option value="triangle">Triangle</option>
            </select>
        </div>

        <div class="control-group">
            <label for="key-count">Keyboard Size</label>
            <select id="key-count">
                <option value="13">13 Keys (1 Octave)</option>
                <option value="25" selected>25 Keys (2 Octaves)</option>
                <option value="37">37 Keys (3 Octaves)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="layout-mode">Key Layout</label>
            <select id="layout-mode">
                <option value="block" selected>DAW Block (Stacked)</option>
                <option value="split">Left / Right Split</option>
            </select>
        </div>

        <div class="control-group">
            <label>Octave Shift</label>
            <div class="octave-stepper">
                <button id="octave-down" class="btn-step">◀</button>
                <span id="octave-label">C4 – C6</span>
                <button id="octave-up" class="btn-step">▶</button>
            </div>
        </div>
        
        <div class="control-group">
            <label for="attack">Attack (<span id="attack-val">0.05</span>s)</label>
            <input type="range" id="attack" min="0.01" max="1" step="0.01" value="0.05">
        </div>

        <div class="control-group">
            <label for="release">Release (<span id="release-val">0.3</span>s)</label>
            <input type="range" id="release" min="0.01" max="2" step="0.01" value="0.3">
        </div>

        <div class="control-group">
            <label for="volume">Master Volume</label>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
        </div>
    </div>

    <!-- Recorder Controls -->
    <div class="recorder-panel">
        <button id="btn-record" class="btn">🔴 Record</button>
        <button id="btn-play" class="btn" disabled>▶️ Play</button>
        <button id="btn-clear" class="btn" disabled>🗑️ Clear</button>
        <button id="btn-export-wav" class="btn" disabled>🔊 Export WAV</button>
        <button id="btn-export-midi" class="btn" disabled>🎼 Export MIDI</button>
        <button id="btn-save" class="btn" disabled>💾 Save JSON</button>
        <button id="btn-load-file" class="btn">📤 Load JSON</button>
        <input type="file" id="file-input" accept=".json" style="display: none;">
        <span id="rec-status" class="status-label">Status: Idle</span>
    </div>

    <div class="keyboard-wrapper" id="keyboard">
        <!-- Keys generated dynamically -->
    </div>

    <div class="instructions" id="instructions">
        <strong>DAW Block:</strong> Oct 1 (Z–M / S–J) | Oct 2 (Q–U / 2–7) | Oct 3 (I–; / 8–=) | High C (')<br>
        <strong>25-Key Split:</strong> Left Hand (Q–U / 2–7) | Right Hand (I–; / 8–=) | High C (')<br>
        <strong>37-Key Split:</strong> Oct 1 (Z–M / S–J) | Left Hand (Q–U / 2–7) | Right Hand (I–; / 8–=) | High C (')
    </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
