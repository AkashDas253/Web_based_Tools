
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fa">
  <meta name="description" content="A collection of browser-based web development utilities.">
  <title>Web Development Util</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <button id="menu" aria-label="Toggle navigation" aria-controls="nav" aria-expanded="false">
        <span aria-hidden="true">☰</span>
      </button>
      <strong>Web Dev Util</strong>
    </div>

    <div class="header-actions">
      <button id="theme" type="button">Theme</button>
      <button id="export" type="button">Export</button>
      <label class="btn" for="import">Import
        <input id="import" type="file" accept="application/json" hidden>
      </label>
      <button id="clear" type="button" class="danger">Clear data</button>
    </div>
  </header>

  <div class="layout">
    <nav id="nav" aria-label="Tools"></nav>
    <main id="view" tabindex="-1"></main>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <noscript>JavaScript is required to use Web Dev Util.</noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
